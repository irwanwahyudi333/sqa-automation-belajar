name: Jalankan Otomatisasi SQA

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

# Memberi izin robot untuk mengunggah halaman web
permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Mengambil kode dari repository
        uses: actions/checkout@v4

      - name: Menyiapkan Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Menjalankan Eksekusi Tes Cucumber BDD
        run: mvn clean test
        continue-on-error: true # PENTING: Robot harus lanjut membuat laporan walau ada tes yang gagal/merah

      - name: Merakit Laporan Web Allure
        uses: simple-elf/allure-report-action@master
        if: always() # Harus selalu dijalankan
        with:
          allure_results: target/allure-results
          allure_history: allure-history

      - name: Mempublikasikan Laporan ke GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
